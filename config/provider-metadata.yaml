name: Trozz/pocketid
resources:
    pocketid_client Resource - pocketid:
        subCategory: ""
        description: Manages an OIDC client in Pocket-ID. OIDC clients are applications that can authenticate users through Pocket-ID. ~> Note The client secret is only available during resource creation and cannot be retrieved later. Store it securely.
        name: pocketid_client Resource - pocketid
        title: pocketid_client Resource - pocketid
        argumentDocs:
            allowed_user_groups: (List of String) List of user group IDs that are allowed to use this client. If empty, all users can use this client.
            callback_urls: (List of String) List of allowed callback URLs for the OIDC client.
            client_secret: (String, Sensitive) The client secret. Only available during resource creation for non-public clients.
            has_logo: (Boolean) Whether the client has a logo configured.
            id: (String) The ID of the OIDC client.
            is_public: (Boolean) Whether this is a public client (no client secret). Defaults to false.
            logout_callback_urls: (List of String) List of allowed logout callback URLs for the OIDC client.
            name: (String) The display name of the OIDC client.
            pkce_enabled: (Boolean) Whether PKCE is enabled for this client. Defaults to true.
        importStatements: []
    pocketid_group Resource - pocketid:
        subCategory: ""
        description: Manages a user group in Pocket-ID. Groups can be used to organize users and control access to OIDC clients.
        name: pocketid_group Resource - pocketid
        title: pocketid_group Resource - pocketid
        argumentDocs:
            friendly_name: (String) The friendly display name of the user group.
            id: (String) The ID of the user group.
            name: (String) The unique name identifier of the user group. This is used as the technical identifier and will be included in tokens.
        importStatements: []
    pocketid_user Resource - pocketid:
        subCategory: ""
        description: Manages a user in Pocket-ID. ~> Important Users must complete passkey registration through the Pocket-ID web interface. This resource only creates the user account; authentication setup must be done separately.
        name: pocketid_user Resource - pocketid
        title: pocketid_user Resource - pocketid
        argumentDocs:
            disabled: (Boolean) Whether the user account is disabled. Defaults to false.
            email: (String) The email address of the user.
            first_name: (String) The first name of the user.
            groups: (Set of String) List of group IDs the user belongs to.
            id: (String) The ID of the user.
            is_admin: (Boolean) Whether the user has administrator privileges. Defaults to false.
            last_name: (String) The last name of the user.
            locale: (String) The locale preference for the user (e.g., 'en', 'fr').
            username: (String) The username for the user. Must be unique.
        importStatements: []
